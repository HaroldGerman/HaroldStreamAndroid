name: Build TushNH APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.json"
      - ".github/workflows/build-tushnh.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Locate apksigner
        id: signer
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          echo "path=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Verify update signature compatibility
        shell: bash
        run: |
          OLD_APK="apk/HaroldStream.apk"
          NEW_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$OLD_APK"
          test -f "$NEW_APK"

          OLD_CERT="$("${{ steps.signer.outputs.path }}" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          NEW_CERT="$("${{ steps.signer.outputs.path }}" verify --print-certs "$NEW_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"

          echo "Existing APK signer: $OLD_CERT"
          echo "New APK signer:      $NEW_CERT"

          if [ -z "$OLD_CERT" ] || [ -z "$NEW_CERT" ]; then
            echo "::error::No se pudo leer la firma de uno de los APK."
            exit 1
          fi

          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "::error::La firma no coincide. No se publicará una actualización incompatible."
            exit 1
          fi

      - name: Prepare TushNH APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TushNH.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TushNH-v52
          path: TushNH.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v52.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TushNH.apk --clobber
          else
            gh release create "$TAG" TushNH.apk \
              --title "TushNH v52.0" \
              --notes "TushNH v52: cambio de nombre oficial, registro directo sin PIN, backend en la nube y persistencia de datos."
          fi
